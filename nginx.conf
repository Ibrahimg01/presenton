user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

events {
  worker_connections 1024;
}

http {
  log_format presenton_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
  include /etc/nginx/mime.types; # Required for SVG mime type
  default_type application/octet-stream; # Required for SVG mime type
  client_max_body_size 100M;

  server {
    listen 80;
    server_name localhost;

    # No source-address bypass on the public listener.
    auth_basic "Presenton administrator";
    auth_basic_user_file /run/presenton/htpasswd;
    server_tokens off;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;

    # Never pass browser credentials to application code or provider services.
    proxy_set_header Authorization "";

    # Log paths only; old integrations may still carry secrets in query strings.
    access_log /var/log/nginx/access.log presenton_safe;

    location / {
      proxy_set_header Authorization "";
      proxy_pass http://localhost:3000;
      proxy_http_version 1.1; # Required for WebSocket
      proxy_set_header Upgrade $http_upgrade; # WebSocket header
      proxy_set_header Connection "upgrade"; # WebSocket header
      proxy_set_header Host $http_host;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
    }

    location /api/v1/ {
      proxy_set_header Authorization "";
      proxy_set_header Host $http_host;
      proxy_pass http://localhost:8000;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
    }

    # MCP
    location /mcp/ {
      proxy_set_header Authorization "";
      proxy_pass http://localhost:8001/mcp/;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
      proxy_set_header Authorization "";
      proxy_pass http://localhost:8001/mcp;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }


    location /docs {
      proxy_set_header Authorization "";
      proxy_pass http://localhost:8000/docs;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
    }

    location /openapi.json {
      proxy_set_header Authorization "";
      proxy_pass http://localhost:8000/openapi.json;
      proxy_read_timeout 30m;
      proxy_connect_timeout 30m;
    }

    # Static
    location /static {
      alias /app/servers/fastapi/static/;
      expires off;
      add_header Cache-Control "private, no-store";
    }

    location /app_data/images/ {
      alias /app_data/images/;
      expires off;
      add_header Cache-Control "private, no-store";
    }

    location /app_data/exports/ {
      alias /app_data/exports/;
      expires off;
      add_header Cache-Control "private, no-store";
    }

    location /app_data/uploads/ {
      alias /app_data/uploads/;
      expires off;
      add_header Cache-Control "private, no-store";
    }

    location /app_data/fonts/ {
      alias /app_data/fonts/;
      expires off;
      add_header Cache-Control "private, no-store";
    }
  }
  server {
    listen 127.0.0.1:8081;
    server_name localhost;
    access_log off;
