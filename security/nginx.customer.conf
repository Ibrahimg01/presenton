user www-data;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_max_body_size 100M;
  server_tokens off;
  log_format presenton_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

  server {
    listen 80;
    server_name localhost;
    auth_request /_site_verify;
    auth_request_set $site_identity $upstream_http_x_presenton_identity;
    add_header Cache-Control "private, no-store" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/access.log presenton_safe;
    location = /_site_verify {
      internal;
      auth_request off;
      proxy_pass http://127.0.0.1:8082/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Internal-Render 0;
      proxy_set_header Cookie $http_cookie;
    }
    location /auth/ {
      auth_request off;
      proxy_pass http://127.0.0.1:8082;
      proxy_set_header Host $http_host;
      proxy_set_header X-Internal-Render 0;
    }
    location /app_data/ {
      proxy_pass http://127.0.0.1:8082;
      proxy_set_header X-Internal-Render 0;
    }
    location /api/v1/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header X-Presenton-Identity $site_identity;
      proxy_set_header Authorization "";
      proxy_set_header Host $http_host;
      proxy_read_timeout 30m;
    }
    location /static/ { alias /app/servers/fastapi/static/; }
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header X-Presenton-Identity $site_identity;
      proxy_set_header Authorization "";
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_read_timeout 30m;
    }
  }

  server {
    listen 127.0.0.1:8081;
    server_name localhost;
    auth_request /_site_verify;
    auth_request_set $site_identity $upstream_http_x_presenton_identity;
    add_header Cache-Control "private, no-store" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/access.log presenton_safe;
    location = /_site_verify {
      internal;
      auth_request off;
      proxy_pass http://127.0.0.1:8082/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Internal-Render 1;
      proxy_set_header Cookie $http_cookie;
    }
    location /auth/ {
      auth_request off;
      proxy_pass http://127.0.0.1:8082;
      proxy_set_header Host $http_host;
      proxy_set_header X-Internal-Render 1;
    }
    location /app_data/ {
      proxy_pass http://127.0.0.1:8082;
      proxy_set_header X-Internal-Render 1;
    }
    location /api/v1/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header X-Presenton-Identity $site_identity;
      proxy_set_header Authorization "";
      proxy_set_header Host $http_host;
      proxy_read_timeout 30m;
    }
    location /static/ { alias /app/servers/fastapi/static/; }
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header X-Presenton-Identity $site_identity;
      proxy_set_header Authorization "";
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_read_timeout 30m;
    }
  }
}
